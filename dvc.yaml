# Pipeline do projeto. Cada estágio declara o comando (cmd), o que ele lê (deps),
# os parâmetros do params.yaml que usa (params) e o que ele gera (outs).
stages:
  prepare:
    cmd: python src/prepare.py
    deps:
    - src/prepare.py
    - src/bike.py
    - data/raw/bike.csv
    outs:
    - data/prepared

  split:
    cmd: python src/split.py
    deps:
    - src/split.py
    - src/bike.py
    - data/prepared
    params:
    - split
    outs:
    - data/split

  train:
    cmd: python src/train.py
    deps:
    - src/train.py
    - src/bike.py
    - data/split/train.csv
    params:
    - train
    - mlflow
    outs:
    - models

  evaluate:
    # TODO: o comando que roda a avaliação
    cmd: python src/evaluate.py
    deps:
    # TODO: o script, o bike.py, o modelo (pasta models) e o arquivo de TESTE
    - src/evaluate.py
    - src/bike.py
    - data/split/test.csv
    - models
    metrics:
    - metrics.json:
        cache: false

  plot:
    # TODO: o comando que gera o gráfico
    cmd: python src/plot.py
    deps:
    # TODO: o script, o modelo e o arquivo de teste
    - src/plot.py
    - src/bike.py
    - data/split/test.csv
    - models/model.joblib
    plots:
    - reports/previsto_vs_real.png:
        cache: false
