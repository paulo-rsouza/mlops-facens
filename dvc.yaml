# Pipeline do projeto. Cada estágio declara o comando (cmd), o que ele lê (deps),
# os parâmetros do params.yaml que usa (params) e o que ele gera (outs).
stages:
  prepare:
    cmd: python src/prepare.py
    deps:
    - src/prepare.py
    - src/bike.py
    - data/raw/bike.csv
    outs:
    - data/prepared

  split:
    cmd: python src/split.py
    deps:
    - src/split.py
    - src/bike.py
    - data/prepared
    params:
    - split
    outs:
    - data/split

  train:
    # TODO: o comando que roda o treino
    cmd: python src/train.py
    deps:
    # TODO: o script, o bike.py e o arquivo de TREINO que o split gera
    - data/split/train.csv
    - src/train.py
    - src/bike.py
    params:
    # TODO: as duas seções do params.yaml que o treino lê
    - train
    outs:
    - models
